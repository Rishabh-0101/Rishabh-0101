<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF">
        <animate attributeName="stop-color" values="#00A8FF;#00E5FF;#8B5CF6;#00D084;#00A8FF" dur="20s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#8B5CF6;#00D084;#00A8FF;#00E5FF" dur="20s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05070F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="360" rx="16" fill="url(#termBg)"/>
  <rect x="2" y="2" width="716" height="356" rx="14" fill="none" stroke="url(#termBorder)" stroke-width="2" filter="url(#glow)"/>

  <!-- title bar -->
  <rect x="0" y="0" width="720" height="36" rx="16" fill="#0E1730"/>
  <rect x="0" y="20" width="720" height="16" fill="#0E1730"/>
  <circle cx="24" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="18" r="6" fill="#27C93F"/>
  <text x="360" y="23" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#94A3B8">rishabh_patel.cpp</text>

  <!-- code -->
  <g font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E2E8F0">
    <text x="24" y="70"><tspan fill="#8B5CF6">class</tspan> <tspan fill="#00E5FF">RishabhPatel</tspan> {</text>
    <text x="24" y="94"><tspan fill="#8B5CF6">public:</tspan></text>
    <text x="44" y="118"><tspan fill="#00D084">string</tspan> role     = <tspan fill="#FFD166">"Full Stack Developer"</tspan>;</text>
    <text x="44" y="142"><tspan fill="#00D084">string</tspan> college  = <tspan fill="#FFD166">"ABES ENGINEERING COLLEGE"</tspan>;</text>
    <text x="44" y="166"><tspan fill="#00D084">string</tspan> location = <tspan fill="#FFD166">"Ghaziabad, India"</tspan>;</text>

    <text x="44" y="200"><tspan fill="#00D084">vector&lt;string&gt;</tspan> interests = {</text>
    <text x="64" y="222"><tspan fill="#FFD166">"Full Stack Development"</tspan>, <tspan fill="#FFD166">"Backend Development"</tspan>,</text>
    <text x="64" y="242"><tspan fill="#FFD166">"Data Structures &amp; Algorithms"</tspan>, <tspan fill="#FFD166">"Open Source"</tspan></text>
    <text x="44" y="262">};</text>

    <text x="44" y="288"><tspan fill="#00D084">void</tspan> sayHi() { cout &lt;&lt; <tspan fill="#FFD166">"Thanks for stopping by! 🚀"</tspan>; }</text>
    <text x="24" y="312">};</text>

    <rect x="270" y="298" width="9" height="16" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="24" y="344" font-family="Fira Code, monospace" font-size="12" fill="#4B5A78">// currently learning: Node.js · Express.js · MongoDB · System Design</text>
</svg>
