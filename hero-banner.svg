<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="55%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05070F"/>
    </linearGradient>

    <linearGradient id="cycleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF">
        <animate attributeName="stop-color"
          values="#00A8FF;#00E5FF;#8B5CF6;#00D084;#00A8FF"
          dur="20s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color"
          values="#8B5CF6;#00D084;#00A8FF;#00E5FF;#8B5CF6"
          dur="20s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#12203A" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.5"/>

  <!-- ambient glows -->
  <circle cx="150" cy="60" r="160" fill="url(#glow1)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="260" r="180" fill="url(#glow2)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- horizon line, color-cycling -->
  <rect x="0" y="158" width="1200" height="2" fill="url(#cycleGrad)" opacity="0.6"/>

  <!-- floating brackets -->
  <g font-family="Fira Code, Consolas, monospace" font-weight="700" fill="#1E2A45" opacity="0.9">
    <text x="60" y="120" font-size="90">{ }</text>
    <text x="1000" y="230" font-size="70">&lt;/&gt;</text>
    <text x="560" y="70" font-size="42" fill="#22304E">const</text>
  </g>

  <!-- floating glass panels -->
  <g>
    <rect x="90" y="150" width="230" height="86" rx="14" fill="#0E1730" stroke="#1E3A5F" stroke-width="1.5" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <g font-family="Fira Code, monospace" font-size="12" fill="#00E5FF" opacity="0.85">
      <text x="108" y="176">$ npm run build</text>
      <text x="108" y="196">✓ compiled</text>
      <text x="108" y="216">status: online</text>
    </g>
  </g>

  <g>
    <rect x="900" y="60" width="220" height="80" rx="14" fill="#0E1730" stroke="#3B2E66" stroke-width="1.5" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g font-family="Fira Code, monospace" font-size="12" fill="#8B5CF6" opacity="0.9">
      <text x="918" y="86">GET /api/status</text>
      <text x="918" y="106">200 OK</text>
      <text x="918" y="126">latency: 42ms</text>
    </g>
  </g>

  <!-- network nodes -->
  <g stroke="url(#cycleGrad)" stroke-width="1.2" opacity="0.55" fill="none">
    <path d="M320 200 L 560 260 L 780 190 L 900 100"/>
  </g>
  <g fill="#00E5FF">
    <circle cx="320" cy="200" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="260" r="4"><animate attributeName="r" values="3;6;3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="190" r="4"><animate attributeName="r" values="3;6;3" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting particles -->
  <g fill="#00A8FF">
    <circle cx="200" cy="280" r="2.2" opacity="0.8">
      <animate attributeName="cy" values="280;40;280" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="300" r="1.8" opacity="0.7">
      <animate attributeName="cy" values="300;30;300" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="290" r="2" opacity="0.75">
      <animate attributeName="cy" values="290;20;290" dur="15.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="15.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="300" r="2.4" opacity="0.8">
      <animate attributeName="cy" values="300;50;300" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="280" r="1.9" opacity="0.7">
      <animate attributeName="cy" values="280;40;280" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outer border glow -->
  <rect x="1" y="1" width="1198" height="318" rx="10" fill="none" stroke="url(#cycleGrad)" stroke-width="1.5" opacity="0.6"/>
</svg>
